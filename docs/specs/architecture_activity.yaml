id: matrix-deduction-activity
title: "MEEL Deduction Flow"
type: activity
version: "1.0"
data:
  start: "receive_query"
  steps:
    "receive_query":
      label: "Receive Query (deduce)"
      kind: "action"
      next: "encode_query"
    "encode_query":
      label: "Encode Query to Vector Vi"
      kind: "action"
      next: "matrix_multiply"
    "matrix_multiply":
      label: "Multiply Vi by Si"
      kind: "action"
      next: "check_fixpoint"
    "check_fixpoint":
      label: "Has Vi changed?"
      kind: "decision"
      branches:
        "yes": "matrix_multiply"
        "no": "decode_result"
    "decode_result":
      label: "Decode Vi to Symbols"
      kind: "action"
      next: "return_facts"
    "return_facts":
      label: "Return Deduced Facts"
      kind: "action"
      next: "end_flow"
  end: "end_flow"
