id: matrix-sequence
title: "Matrix Inference Sequence"
type: sequence
version: "1.0"
data:
  participants:
    - id: "Client Code"
    - id: "OWLFeeder"
    - id: "RuleMatrixCompiler"
    - id: "MEELEngine"
    - id: "CanonicalHypertensor"
  messages:
    - from: "Client Code"
      to: "OWLFeeder"
      message: "ingest(owl_file)"
      group: "Ingestion Phase"
    - from: "OWLFeeder"
      to: "RuleMatrixCompiler"
      message: "compile(ast_nodes)"
      group: "Ingestion Phase"
    - from: "RuleMatrixCompiler"
      to: "CanonicalHypertensor"
      message: "update_mask_Si(compiled_rules)"
      group: "Ingestion Phase"
    - from: "Client Code"
      to: "MEELEngine"
      message: "deduce(query)"
      group: "Query Phase"
    - from: "MEELEngine"
      to: "CanonicalHypertensor"
      message: "multiply(Vi, Si)"
      group: "Query Phase"
    - from: "CanonicalHypertensor"
      to: "MEELEngine"
      message: "return new_Vi"
      group: "Query Phase"
    - from: "MEELEngine"
      to: "Client Code"
      message: "return deduced_facts"
      group: "Query Phase"
