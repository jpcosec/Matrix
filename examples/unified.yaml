bridges:
- from: vegetales
  from_objects:
  - lechuga
  - espinaca
  - zanahoria
  - apio
  name: vegetal_color
  to: colores
  to_objects:
  - verde
  - verde
  - rojo
  - verde
contexts:
  colores:
    objects:
      rojo:
        class: color
      verde:
        class: color
    properties:
      color:
        applies_to: color
    truths:
      rojo:
        color: true
      verde:
        color: true
  vegetales:
    objects:
      apio:
        class: vegetal
      espinaca:
        class: vegetal
      lechuga:
        class: vegetal
      zanahoria:
        class: vegetal
    properties:
      comestible:
        applies_to: vegetal
      hoja:
        applies_to: vegetal
      hoja.lisa:
        applies_if:
          property: hoja
          value: true
      hoja.rugosa:
        applies_if:
          property: hoja
          value: true
      raíz:
        applies_to: vegetal
      tallo:
        applies_to: vegetal
    truths:
      apio:
        comestible: true
        hoja: false
        raíz: false
        tallo: true
      espinaca:
        comestible: true
        hoja: true
        hoja.lisa: false
        hoja.rugosa: true
        raíz: false
        tallo: false
      lechuga:
        comestible: true
        hoja: true
        hoja.lisa: true
        hoja.rugosa: false
        raíz: false
        tallo: false
      zanahoria:
        comestible: true
        hoja: false
        raíz: true
        tallo: false
subcontexts:
  hoja:
    name: hojas_sub
    objects:
    - lechuga
    - espinaca
    - zanahoria
    - apio
    properties:
    - rugosa
    - lisa
    - forma
    truths:
      espinaca:
        forma: ondulada
        lisa: false
        rugosa: true
      lechuga:
        forma: redonda
        lisa: true
        rugosa: false
