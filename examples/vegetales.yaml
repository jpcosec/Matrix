context: vegetales
objects:
  lechuga:
    class: vegetal
  espinaca:
    class: vegetal
  zanahoria:
    class: vegetal
  apio:
    class: vegetal
properties:
  hoja:
    applies_to: vegetal
  raíz:
    applies_to: vegetal
  tallo:
    applies_to: vegetal
  hoja.rugosa:
    applies_if:
      property: hoja
      value: true
  hoja.lisa:
    applies_if:
      property: hoja
      value: true
rules:
  - name: hoja_requires_leaf
    condition:
      property: hoja.rugosa
      requires:
        property: hoja
        value: true
  - name: lisa_requires_leaf
    condition:
      property: hoja.lisa
      requires:
        property: hoja
        value: true
truths:
  lechuga:
    hoja: true
    raíz: false
    tallo: false
    hoja.lisa: true
    hoja.rugosa: false
  espinaca:
    hoja: true
    raíz: false
    tallo: false
    hoja.lisa: false
    hoja.rugosa: true
  zanahoria:
    hoja: false
    raíz: true
    tallo: false
  apio:
    hoja: false
    raíz: false
    tallo: true
