[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["prototypes", "DESK"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "PL", "UP", "B", "PERF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["prototypes/"]
