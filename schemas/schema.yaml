wigame_id: str
ejeA:
- list of subject symbol IDs
ejeB:
- list of term symbol IDs
relacion: str (single relation admitted by the Li space)
contexto: str | null (parent context ID)
Li:
  li_id: str
  metadata: {}
Vi:
  matrix_id: str
  rows:
  - subject IDs matching ejeA
  columns:
  - term IDs matching ejeB
  values:
  - - "0101∅" (compact string, one char per cell: 1=true, 0=false, ∅=void)
  metadata: {}
Si:
  matrix_id: str
  rows:
  - subject IDs matching ejeA
  columns:
  - term IDs matching ejeB
  values:
  - - "VVLUU" (compact string: V=sinnvoll, L=sinnlos, U=unsinnig)
  metadata: {}
facts:
- fact_id: str
  truth: 'true' | 'false' | ∅
  proposition:
    proposition_id: str
    relation_id: str
    subject_symbol_id: str
    object_symbol_id: str
    wigame_id: str
  evidence: {}
metadata: {}
